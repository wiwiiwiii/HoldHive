spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:holdhive}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:holdhive}
    password: ${DB_PASSWORD:holdhive}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect

holdhive:
  market:
    external-enabled: ${HOLDHIVE_MARKET_EXTERNAL_ENABLED:true}
    cache-ttl: ${HOLDHIVE_MARKET_CACHE_TTL:30d}
    http-timeout: ${HOLDHIVE_MARKET_HTTP_TIMEOUT:3s}
  llm:
    api-key: ${DEEPSEEK_API_KEY:}
