name: pr-check

on:
  pull_request:
    branches:
      - qa
      - main
  push:
    branches:
      - qa
      - main

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: ./mvnw -B verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test -- --run
      - name: Build frontend
        run: npm run build

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          test -f docs/guideline/project/api_documentation_zh.md
          test -f docs/guideline/project/database_design_zh.md
          test -f docs/guideline/project/team_project_guideline_zh.md
          test -f docs/design/lanhu/README.md
